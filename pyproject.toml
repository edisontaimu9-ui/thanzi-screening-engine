[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thanzi-screen"
version = "0.7.0"
description = "Independent under-five malnutrition screening engine for Thanzi AI (Malawi)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "openpyxl", "httpx~=0.28.1", "pyyaml", "coverage"]
# HTTP edge only (Phase 6). The engine itself stays standard library.
api = ["fastapi~=0.162.2", "pydantic~=2.14.3", "uvicorn~=0.54.0"]
# Optional local LLM client (D128-D133): the HTTP transport for Ollama and llama.cpp servers. Off by default and not in
# the release image. The package imports without it, and the mock provider needs nothing.
llm = ["httpx~=0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thanzi_screen.anthro" = ["reference_tables/*.csv", "reference_tables/MANIFEST.json"]
# Preterm data. fenton2025_lms.json is CC BY-NC-ND 4.0 (Dr Tanis Fenton, 2025): ship it unmodified, with its attribution.
"thanzi_screen.preterm" = ["fenton2025_lms.json", "preterm_rules.json", "routing_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["thanzi_screen"]
branch = true

[tool.coverage.report]
# Reported only. No failure threshold yet (Phase 7 Q3): set one after reviewing the measured numbers.
show_missing = true
skip_empty = true
