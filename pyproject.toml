[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thanzi-screen"
version = "0.3.0"
description = "Independent under-five malnutrition screening engine for Thanzi AI (Malawi)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thanzi_screen.anthro" = ["reference_tables/*.csv", "reference_tables/MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
