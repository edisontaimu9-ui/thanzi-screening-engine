name: Release

# Runs when a version tag is pushed (for example v0.7.0). Builds the image, tests it, and publishes a GitHub
# pre-release with the image tarball, SBOMs, checksums and the test evidence. It does not publish to any registry
# (registry publishing is a deployment decision). Every release is marked pre-release: not validated.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THANZI_REQUIRE_API_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install (pinned by constraints.txt)
        run: pip install -c constraints.txt -e ".[dev,api]"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import thanzi_screen; print(thanzi_screen.__version__)")
          echo "package version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Release notes exist for this tag
        run: test -f "docs/release/${GITHUB_REF_NAME}.md"
      - name: Full test suite
        run: python -m pytest -q
      - name: OpenAPI, case pack and rule traceability
        run: |
          python scripts/export_openapi.py --check
          python scripts/build_case_pack.py --check
          python scripts/build_traceability.py --check

  release:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build --build-arg VERSION="${GITHUB_REF_NAME#v}" -t "thanzi-screen:${GITHUB_REF_NAME}" .
      - name: Scan image for vulnerabilities (Trivy, fixed HIGH and CRITICAL fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thanzi-screen:${{ github.ref_name }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Image SBOM (CycloneDX, includes operating system packages)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: thanzi-screen:${{ github.ref_name }}
          format: cyclonedx
          output: sbom-image.cdx.json
      - name: Smoke test the built image
        run: |
          THANZI_GATEWAY_KEY=$(openssl rand -hex 24)
          THANZI_AUDIT_KEY=$(openssl rand -hex 24)
          export THANZI_GATEWAY_KEY THANZI_AUDIT_KEY
          docker run -d --name thanzi -e THANZI_GATEWAY_KEY -e THANZI_AUDIT_KEY -p 127.0.0.1:8080:8080 "thanzi-screen:${GITHUB_REF_NAME}"
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' thanzi)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 3
          done
          test "$status" = "healthy"
          python3 scripts/smoke_api.py --base-url http://127.0.0.1:8080
          docker stop thanzi
      - name: Runtime SBOM from the pinned Python dependencies
        run: |
          python -m venv sbom-env
          sbom-env/bin/pip install -c constraints.txt ".[api]"
          python -m pip install cyclonedx-bom==8.0.1
          cyclonedx-py environment sbom-env/bin/python --pyproject pyproject.toml --of JSON --sv 1.6 -o sbom-runtime.cdx.json
      - name: Collect release files
        run: |
          mkdir dist
          docker save "thanzi-screen:${GITHUB_REF_NAME}" | gzip -9 > "dist/thanzi-screen-${GITHUB_REF_NAME}-image.tar.gz"
          cp sbom-image.cdx.json "dist/thanzi-screen-${GITHUB_REF_NAME}-sbom-image.cdx.json"
          cp sbom-runtime.cdx.json "dist/thanzi-screen-${GITHUB_REF_NAME}-sbom-runtime.cdx.json"
          cp docs/testing/test-report.md docs/testing/traceability.md docs/testing/case-pack.xlsx docs/api/openapi.json dist/
          cp docs/deployment/runbook.md dist/deployment-runbook.md
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --prerelease \
            --title "Thanzi screening engine ${GITHUB_REF_NAME}: Release Candidate, Not Validated" \
            --notes-file "docs/release/${GITHUB_REF_NAME}.md"
