# Weekly update proposals. Each proposal is a pull request that runs the full CI.
# constraints.txt is refreshed by hand with scripts/refresh_constraints.py because Dependabot does not read it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
